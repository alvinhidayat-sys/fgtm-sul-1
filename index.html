<style>
:root{--ink:#0b1b33;--ink2:#14305a;--bg:#f3f5fb;--card:#fff;--line:#e4e8f2;--mut:#64708a;--txt:#16233b;
--teal:#12b5a6;--violet:#6d5dfc;--amber:#ffb020;--coral:#ff6159;--green:#17b26a;--blue:#2e90fa}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--ink) 0%,var(--ink2) 55%,#3b2f93 100%);color:#fff;padding-top:env(safe-area-inset-top,0)}
.marq{background:linear-gradient(90deg,var(--amber),#ff8a3d);color:#2a1700;font-weight:700;font-size:12px;overflow:hidden;white-space:nowrap;padding:5px 0}

@keyframes mq{to{transform:translateX(-100%)}}
.hd{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--coral));display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(255,97,89,.35)}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.2px}.brand p{margin:0;font-size:11px;color:#b9c6e6}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:8px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:#fff;background:rgba(255,255,255,.12)}
.btn:hover{background:rgba(255,255,255,.2)}.btn.pri{background:linear-gradient(135deg,var(--teal),var(--blue))}
.sync{font-size:11px;color:#b9c6e6;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(23,178,106,.25)}.dot.off{background:var(--coral);box-shadow:0 0 0 3px rgba(255,97,89,.25)}.dot.spin{background:var(--amber);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.35}}
nav{max-width:1280px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid transparent;background:transparent;color:#c5d0ee;padding:8px 14px;border-radius:999px;font:600 12.5px 'Plus Jakarta Sans';cursor:pointer;white-space:nowrap}
nav button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18)}
main{max-width:1280px;margin:0 auto;padding:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(20,48,90,.05)}
.card h2{margin:0 0 4px;font-size:15px;font-weight:800}.sub{color:var(--mut);font-size:12px;margin:0 0 12px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.filters label{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
select,input[type=text],input[type=date]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fbfcff;font:500 13px 'Plus Jakarta Sans';color:var(--txt)}
.kpi{position:relative;overflow:hidden;color:#fff;border:0;padding:16px}
.kpi small{font-size:11px;opacity:.9;font-weight:600;display:block}.kpi b{font-size:26px;font-weight:800;letter-spacing:-.5px;display:block;margin-top:2px}.kpi span{font-size:11px;opacity:.85}
.k1{background:linear-gradient(135deg,#6d5dfc,#4a3fd1)}.k2{background:linear-gradient(135deg,#ff6159,#e0393a)}.k3{background:linear-gradient(135deg,#12b5a6,#0b8f90)}.k4{background:linear-gradient(135deg,#ffb020,#f58a1f)}.k5{background:linear-gradient(135deg,#2e90fa,#1a62c9)}.k6{background:linear-gradient(135deg,#17b26a,#0e8a50)}.k7{background:linear-gradient(135deg,#0b1b33,#27407a)}.k8{background:linear-gradient(135deg,#d6409f,#9b2c8a)}
.chartbox{position:relative;height:290px}
.seg{display:inline-flex;background:#eef1f9;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font:600 12px 'Plus Jakarta Sans';color:var(--mut);cursor:pointer}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.12)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.b-ok{background:#dcf7e9;color:#0d7a46}.b-w{background:#fff1cf;color:#9a6200}.b-k{background:#ffe0de;color:#b42318}
.stat{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.ring b{font-size:30px;font-weight:800;line-height:1}.ring span{font-size:10px;color:var(--mut);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{background:#f3f6fd;text-align:left;padding:9px 10px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.neg{color:#b42318;font-weight:800}.pos{color:#0d7a46;font-weight:800}
.bar{height:9px;border-radius:99px;background:#eef1f9;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--violet))}
.cause{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;background:#fff}
.cause h3{margin:0;font-size:14.5px}.cause .meta{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
.acts4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ac{border-radius:12px;padding:11px 12px;border:1px solid var(--line);background:#fafbff}
.ac h4{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.ac ul{margin:0;padding-left:16px}.ac li{margin:3px 0;font-size:12.5px}.ac li b{font-weight:700}
.a-i{border-left:4px solid var(--blue)}.a-p{border-left:4px solid var(--teal)}.a-r{border-left:4px solid var(--green)}.a-y{border-left:4px solid var(--amber)}
.why{display:grid;gap:8px}.why .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;background:#f7f9ff;border:1px solid var(--line)}
.why .it small{grid-column:1/-1;color:var(--mut);font-size:12px}
.note{background:#eef6ff;border:1px solid #cfe4ff;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#1c3f6e}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px}.pager button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font:600 12px 'Plus Jakarta Sans';cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:11.5px;padding:18px 16px}
.kpi[onclick]{cursor:pointer;transition:transform .15s,box-shadow .15s}.kpi[onclick]:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,48,90,.22)}.kpi em{display:block;font-style:normal;font-size:10px;opacity:.75;margin-top:4px}
.mdl{position:fixed;inset:0;z-index:200;background:rgba(11,27,51,.6);display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.mbox{background:#fff;border-radius:20px;width:min(980px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}.mh h2{margin:0 0 2px;font-size:16px;font-weight:800}
.mhb{display:flex;gap:8px;flex:none}.xb{border:0;border-radius:10px;padding:9px 13px;font:700 12px 'Plus Jakarta Sans';color:#fff;background:linear-gradient(135deg,var(--teal),var(--blue));cursor:pointer}.xc{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;font-size:14px;cursor:pointer}
.num{color:#1a62c9;font-weight:800;cursor:pointer;border-bottom:1.5px dotted #1a62c9;padding:0 1px}.num:hover{background:#e8f1ff;border-radius:4px}
.mb{padding:4px 18px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
@media(max-width:640px){.mh{flex-direction:column}.mdl{padding:8px;align-items:flex-end}.mbox{max-height:94vh;border-radius:18px}}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.acts4{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}main{padding:12px}.kpi b{font-size:21px}.chartbox{height:250px}.hd{padding:10px 12px}.btn span{display:none}.ring{width:108px;height:108px}.ring div{width:82px;height:82px}.ring b{font-size:25px}.brand p{display:none}}
@media print{.top,.filters,.pager,.acts{display:none}body{background:#fff}}
</style>

<body>
<div class="top">
  <div class="marq"><div id="mq"></div></div>
  <div class="hd">
    <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div>
      <div><h1>UP2D Suluttenggo</h1><p>Monitoring & Evaluasi Padam Distribusi 20 kV</p></div></div>
    <div class="acts">
      <div class="sync"><i id="dot" class="dot spin"></i><span id="syncTxt">Memuat…</span></div>
      <button class="btn" onclick="loadAll()">⟳ <span>Segarkan</span></button>
      <button class="btn pri" onclick="exportXlsx()">⬇ <span>Excel</span></button>
      <button class="btn" onclick="window.print()">🖨 <span>Cetak</span></button>
    </div>
  </div>
  <nav id="nav"></nav>
</div>
<main id="app"><div class="empty">Memuat data…</div></main>
<footer>PLN Nusa Daya Unit Layanan Manado, Tahuna &amp; Kotamobagu</footer>
<script>
/* ================= KONFIGURASI SUMBER DATA ================= */
const SRC={
  utama:{id:'1F0uJP3miMjLTU8ItaH_uHBd8vYqQWWH7arPE3aWJYr4',gid:'1843897479'},
  backup:{id:'1pKw9BR7_FUpXooqG3_n2VSHKjjNAo2YdC7qxsHAZUe0',gid:'0'},
  aset:{id:'1F0uJP3miMjLTU8ItaH_uHBd8vYqQWWH7arPE3aWJYr4',gid:'39281652'}
};
const GAS='https://script.google.com/macros/s/AKfycbwdo3p2EeECkrrd_J3bowHSiT55rPYbihnwti9SCPQhZH1fDqoumXO8LVob8-QCeGA/exec';
const REFRESH_MIN=5, MIN_DUR=5;
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
document.getElementById('mq').textContent=('Data Padam Trip hanya di atas 5 Menit yang di tampilkan   •   ').repeat(6);

/* ================= UTIL ================= */
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:d,minimumFractionDigits:d});
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseDate(a){
  if(!a||a==='-'||a.includes('REF'))return null;
  const mp={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,agt:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
  const e=a.trim().toLowerCase();let r=e.match(/^(\d{1,2})[-/ ]([a-z]{3})[a-z]*[-/ ](\d{2,4})$/);
  if(r){let y=+r[3];if(y<100)y+=2000;const m=mp[r[2]];if(m!==undefined)return new Date(y,m,+r[1])}
  r=e.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);if(r)return new Date(+r[1],+r[2]-1,+r[3]);
  r=e.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(r)return new Date(+r[3],+r[2]-1,+r[1]);
  const t=Date.parse(a);return isNaN(t)?null:new Date(t)}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function monthIdx(s){const m=String(s).match(/^([A-Za-z]+)\s+(\d{4})$/);if(!m)return 0;return +m[2]*12+Math.max(BLN.findIndex(x=>x.toLowerCase()===m[1].toLowerCase()),0)}

/* ================= CSV ================= */
function csvRows(a){const t=[];let e=[],r='',q=false;
  for(let i=0;i<a.length;i++){const h=a[i],n=a[i+1];
    if(h==='"'&&q&&n==='"'){r+='"';i++}else if(h==='"')q=!q;
    else if(h===','&&!q){e.push(r.trim());r=''}
    else if((h==='\r'||h==='\n')&&!q){if(h==='\r'&&n==='\n')i++;e.push(r.trim());if(e.some(x=>x.length))t.push(e);e=[];r=''}
    else r+=h}
  if(r||e.length){e.push(r.trim());t.push(e)}return t}

const firstOk=ps=>new Promise((res,rej)=>{let n=ps.length,last;ps.forEach(p=>p.then(res,e=>{last=e;if(--n===0)rej(last)}))});
function fetchCsv(s,tag,useGas){
  const urls=[`https://docs.google.com/spreadsheets/d/${s.id}/export?format=csv&gid=${s.gid}`,
              `https://docs.google.com/spreadsheets/d/${s.id}/gviz/tq?tqx=out:csv&headers=0&gid=${s.gid}`];
  if(useGas)urls.push(`${GAS}?sumber=${tag}`);
  const one=async u=>{const c=new AbortController,t=setTimeout(()=>c.abort(),15000);
    try{const r=await fetch(u,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
      const x=await r.text();if(/^\s*<(!doctype|html)/i.test(x)||/^ERROR:/.test(x))throw new Error('Akses ditolak');return x}
    finally{clearTimeout(t)}};
  return firstOk(urls.map(one))} /* semua sumber dicoba paralel, yang tercepat & valid dipakai */

/* ================= PARSER LOGSHEET ================= */
function parseLog(text){
  const t=csvRows(text);let hi=-1;
  for(let i=0;i<Math.min(20,t.length);i++){const u=t[i].map(x=>x.toUpperCase());
    if(u.some(x=>x.includes('UP3'))&&u.some(x=>x.includes('FEEDER')||x.includes('PMT'))){hi=i;break}}
  if(hi<0&&t.length)hi=0;
  const out=[];let bulan='Oktober 2026';
  for(let i=hi+1;i<t.length;i++){const h=t[i];if(!h||h.length<5)continue;
    const g=k=>(h[k]||'').trim();
    const no=h[0]||'',up3=g(1),ulp=g(2),tgl=g(3),fd=g(4),pmt=g(5),zona=g(6),rm=g(7),jp=g(8),jt=g(9),jd=g(10),jm=g(12),lama=g(14),ket=g(15),ind=g(16),bb=g(17),
      klp=g(22),sub=g(23),cuaca=g(24),disp=g(25),just=g(28),rc1=g(29),ens=g(31),dur=g(33);
    if((!up3&&!fd&&!pmt&&!tgl)||up3.includes('UNIT INDUK')||up3.includes('UNIT PELAKSANA')||no==='NO'||tgl.includes('REF'))continue;
    let tipe='Trip';
    if(jd&&jd!=='-')tipe='Dilepas';
    else if((jt&&jt!=='-')||rm.toUpperCase().includes('RECLOSE'))tipe='Trip';
    else if(klp.includes('HAR')||ket.toLowerCase().includes('dilepas')||ket.toLowerCase().includes('har')||rm.includes('RR')||rm.includes('MM'))tipe='Dilepas';
    const U=up3.toUpperCase();let dcc='DCC Manado';
    if(U.includes('GORONTALO')||U.includes('KWANDANG')||U.includes('MARISA'))dcc='DCC Gorontalo';
    else if(U.includes('PALU')||U.includes('TOLITOLI')||U.includes('DONGGALA')||U.includes('PARIGI'))dcc='DCC Palu';
    else if(U.includes('LUWUK')||U.includes('BANGGAI')||U.includes('MOROWALI'))dcc='DCC Luwuk';
    const d=parseDate(tgl);if(d)bulan=BLN[d.getMonth()]+' '+d.getFullYear();
    let mnt=0;const dv=parseFloat(dur.replace(',','.'));
    if(dur&&!isNaN(dv))mnt=Math.round(dv);else if(lama&&lama.includes(':')){const c=lama.split(':');mnt=(parseInt(c[0],10)||0)*60+(parseInt(c[1],10)||0)}
    const ua=(ket+' '+sub).toLowerCase();let kat='Eksternal';
    if(['komponen','peralatan jtm','isolator','jumper putus','kawat rantas','arrester','bushing','kubikel','lost kontak','keropos','gagal proteksi'].some(x=>ua.includes(x)))kat='Internal';
    const cl=rm.toUpperCase(),ul=rc1.toUpperCase(),s2=just.toUpperCase();let nor='Remote';
    if(ua.includes('coba masuk gagal')||ua.includes('masuk gagal')||ua.includes('fail')||s2.includes('TRIP BERULANG GAGAL')||ul.includes('GAGAL'))nor='Gagal Remot';
    else if(cl==='M'||cl==='MM'||ul.includes('MANUAL LOKAL')||ua.includes('masuk manual'))nor='Lokal';
    let ar='Tidak Ada AR';
    if(cl.includes('RECLOSE')||ul.includes('AUTORECLOSE KERJA')||ua.includes('autoreclose'))ar=(ua.includes('ar gagal')||ua.includes('autoreclose gagal')||s2.includes('GAGAL'))?'Trip Berulang / Gagal':'Kerja / Sukses';
    let alasan='-';
    if(tipe==='Dilepas'){
      if(ua.includes('emergency')||sub.toUpperCase().includes('EMERGENCY'))alasan='Perbaikan Emergency';
      else if(ua.includes('manuver')||klp.includes('MANUVER'))alasan='Manuver Beban';
      else if(ua.includes('trafo gi')||sub.toUpperCase().includes('TRAFO GI'))alasan='Pemeliharaan Trafo GI';
      else if(ua.includes('konstruksi'))alasan='Pekerjaan Konstruksi';
      else if(ua.includes('row')||ua.includes('pangkas')||ua.includes('mapalus'))alasan='Pekerjaan ROW / Pemangkasan';
      else if(ua.includes('jaringan')||sub.toUpperCase().includes('JARINGAN'))alasan='Pemeliharaan Jaringan (HAR)';
      else alasan='Pekerjaan Operasional Lainnya'}
    const num=x=>parseFloat(x.replace(/\./g,'').replace(',','.').replace(/[^0-9.]/g,''))||0;
    out.push({dcc,up3:up3||'LAINNYA',ulp:ulp||'NON-ULP / KHUSUS',bulan,tanggal:tgl||'-',date:d,feeder:fd||'-',pmt:pmt||'-',zona:zona||'-',tipe,remoteManual:rm||'-',
      jamPadam:jp||'-',jamTrip:jt||'-',jamDilepas:jd||'-',jamMasuk:jm||'-',lama:lama||'-',menit:mnt,ket:ket||'-',indikasi:ind||'-',beban:num(bb),ens:num(ens),
      sub:sub||'Lain-lain',cuaca:cuaca||'CERAH',disp:disp||'-',kat,nor,ar,alasan})}
  return out}

/* Gabung 2 sumber: baris identik (dalam sumber sama maupun lintas sumber) hanya dihitung satu kali */
const rowKey=e=>[e.tanggal,e.up3,e.ulp,e.feeder,e.pmt,e.jamPadam,e.jamTrip,e.jamDilepas,e.jamMasuk,e.menit,e.ket].join('|').toLowerCase();
function mergeSources(a,b){const seen=new Set,out=[];
  for(const e of [...a,...b]){const k=rowKey(e);if(seen.has(k))continue;seen.add(k);out.push(e)}
  return out.sort((x,y)=>(x.date?+x.date:0)-(y.date?+y.date:0))}

/* ================= DATA ASET ================= */
function parseAset(text){
  const t=csvRows(text);let hi=-1;
  for(let i=0;i<Math.min(15,t.length);i++){const u=t[i].map(x=>x.toUpperCase());if(u.some(x=>x.includes('PENYULANG'))&&u.some(x=>x.includes('UP3'))){hi=i;break}}
  if(hi<0)return[];const H=t[hi].map(x=>x.toUpperCase());
  const ix=k=>H.findIndex(x=>x.includes(k));
  const iN=1,iM=ix('MOTORIZED'),iP=ix('PENYULANG'),iG=ix('GARDU'),iU=ix('ULP'),i3=ix('UP3');
  const seen=new Set,out=[];
  for(let i=hi+1;i<t.length;i++){const r=t[i];const nm=(r[iN]||'').trim(),pn=(r[iP]||'').trim();if(!nm||!pn)continue;
    const row={nama:nm,mode:(r[iM]||'').trim().toUpperCase(),peny:pn,gi:(r[iG]||'').trim(),ulp:(r[iU]||'').trim(),up3:(r[i3]||'').trim()};
    const k=[nm,pn,row.gi].map(norm).join('|');if(seen.has(k))continue;seen.add(k);out.push(row)}
  return out}

    if((a||b)&&!e.date)return false;if(a&&e.date<a)return false;if(b&&e.date>b)return false;
    if(q&&![e.feeder,e.pmt,e.ket,e.indikasi,e.ulp,e.up3,e.sub,e.disp].some(x=>(x||'').toLowerCase().includes(q)))return false;
    return true})}
function asetScope(){const f=S.f;const up3s=f.up3!=='SEMUA'?[f.up3]:f.dcc!=='SEMUA'?DCC_UP3[f.dcc]:null;

const CAUSES={
 pohon:'Pohon / Tanaman Menyentuh Jaringan',
 sesaat:'Gangguan Sesaat / Petir',

function causeOf(e){const s=(e.sub||'').toUpperCase(),k=(e.ket||'').toLowerCase();
  if(s.includes('POHON')||/pohon|dahan|bambu|ranting|layang/.test(k))return'pohon';
  if(s.includes('SESAAT')||/autoreclose|petir|sambar/.test(k))return'sesaat';
  if(s.includes('KOMPONEN')||s.includes('PERALATAN')||/isolator|jumper|trafo|kawat|arrester|cut ?out|kubikel|konektor/.test(k))return'komponen';
  if(s.includes('BINATANG')||/ular|burung|kelelawar|tikus|biawak/.test(k))return'binatang';
  if(s.includes('TIDAK DITEMUKAN')||/tidak ada temuan|belum ditemukan/.test(k))return'belum';
  if(s.includes('PEMBANGKIT')||/ufr|upls|pembangkit|kebakaran/.test(k))return'pembangkit';
  return'lain'}
const inc=(o,k,v=1)=>o[k]=(o[k]||0)+v;
function analyze(list){
  const trips=list.filter(e=>e.tipe==='Trip'),dil=list.filter(e=>e.tipe==='Dilepas');
  const T=trips.length,total=list.length,pctAll=total?T/total*100:0;
  const aset=asetScope().length,pctAset=aset?T/aset*100:null;
  const ens=trips.reduce((s,e)=>s+e.ens,0),avgDur=T?trips.reduce((s,e)=>s+e.menit,0)/T:0;
  const cz={};trips.forEach(e=>{const k=causeOf(e);(cz[k]=cz[k]||{n:0,ens:0,min:0,beban:0,list:[]});const c=cz[k];c.n++;c.ens+=e.ens;c.min+=e.menit;c.beban+=e.beban;c.list.push(e)});
  const causes=Object.entries(cz).sort((a,b)=>b[1].n-a[1].n);
  const fd={},ul={},hr=new Array(24).fill(0),cw={},nor={};
  trips.forEach(e=>{if(e.feeder!=='-'){fd[e.feeder]=fd[e.feeder]||{n:0,up3:e.up3,ulp:e.ulp};fd[e.feeder].n++}
    ul[e.ulp]=ul[e.ulp]||{n:0,up3:e.up3,min:0};ul[e.ulp].n++;ul[e.ulp].min+=e.menit;
    const h=parseInt((e.jamTrip!=='-'?e.jamTrip:e.jamPadam).split(':')[0],10);if(h>=0&&h<24)hr[h]++;
    inc(cw,(e.cuaca||'CERAH').toUpperCase());inc(nor,e.nor)});
  const topF=Object.entries(fd).sort((a,b)=>b[1].n-a[1].n)[0],topU=Object.entries(ul).sort((a,b)=>b[1].n-a[1].n)[0];
  const pk=hr.indexOf(Math.max(...hr)),pkN=hr[pk],topW=Object.entries(cw).sort((a,b)=>b[1]-a[1])[0];
  /* Skor keandalan & alasan */
  let score=100;const why=[];
  const add=(f,val,pen,reason)=>{score-=pen;why.push({f,val,pen,reason})};
  if(T===0){why.push({f:'Padam trip >5 menit',val:'0 kejadian',pen:0,reason:'Tidak ada gangguan trip berdurasi di atas 5 menit pada cakupan data yang dipilih, sehingga tidak ada pengurang skor.'})}
  else{
   let p=pctAll>60?35:pctAll>40?25:pctAll>20?15:5;
   add('Porsi trip terhadap semua laporan',fmt(pctAll,1)+'%',p,`Dari ${total} laporan tercatat (trip + pemeliharaan) ${T} adalah trip. Makin besar porsi padam tak terencana dibanding padam terencana, makin rendah keandalan karena gangguan tidak dapat diantisipasi pelanggan maupun operator.`);
   p=avgDur>120?20:avgDur>60?12:avgDur>30?6:0;
   add('Rata-rata durasi pemulihan trip',fmt(avgDur,1)+' menit',p,avgDur>30?`Durasi pemulihan rata-rata melampaui 30 menit. Durasi panjang menandakan waktu pelacakan, isolasi, dan penormalan masih lambat sehingga berkontribusi besar ke indeks SAIDI.`:'Durasi pemulihan rata-rata masih ≤ 30 menit sehingga tidak ada pengurang skor.');
   const tf=topF?topF[1].n:0;p=tf>=10?15:tf>=5?8:0;
   add('Konsentrasi gangguan pada satu penyulang',topF?`${topF[0]} (${tf}x)`:'-',p,tf>=5?`Penyulang ${topF[0]} mengalami ${tf} trip. Gangguan berulang pada penyulang yang sama mengindikasikan akar masalah belum tuntas (kondisi jaringan, proteksi, atau lingkungan).`:'Tidak ada penyulang dengan trip berulang ≥ 5 kali.');
   if(pctAset!==null){p=pctAset>10?15:pctAset>5?8:pctAset>2?4:0;
     add('Trip terhadap jumlah aset',fmt(pctAset,2)+'% ('+T+' trip / '+fmt(aset)+' aset)',p,p?`Jumlah trip setara ${fmt(pctAset,2)}% dari seluruh aset switching pada cakupan ini. Intensitas gangguan per aset yang tinggi menunjukkan beban gangguan per perangkat jaringan melebihi batas wajar.`:'Intensitas trip terhadap jumlah aset masih rendah (≤ 2%).')}
   else why.push({f:'Trip terhadap jumlah aset',val:'Data aset belum termuat',pen:0,reason:'Data aset (spreadsheet gid=39281652) belum dapat dibaca sehingga faktor ini tidak ikut dihitung.'});
   const gr=(nor['Gagal Remot']||0)/T*100;p=gr>=15?6:gr>=8?3:0;
   add('Kegagalan penormalan remote',fmt(gr,1)+'%',p,p?'Persentase kegagalan penormalan jarak jauh tinggi; manuver harus dikerjakan manual di lapangan sehingga pemulihan lebih lama.':'Kegagalan penormalan remote rendah.');}
  score=Math.max(10,Math.min(100,Math.round(score)));
  const status=score<60?'KRITIS':score<80?'WASPADA':'BAIK';
  const ctx={vip:trips.some(e=>/bandara|gub|vvip|polda|walikota|istana|rsup|rumah sakit/i.test(e.feeder+' '+e.pmt+' '+e.ket)),
    gardu:trips.some(e=>/gardu|\bGH_|\bGD_|kubikel/i.test(e.pmt+' '+e.ket)),
    icon:list.some(e=>/iconnet|stroomnet/i.test(e.ket)),
    konstruksi:dil.filter(e=>e.alasan==='Pekerjaan Konstruksi').length,
    lokal:T?((nor['Lokal']||0)+(nor['Gagal Remot']||0))/T*100:0,
    beban:T?trips.reduce((s,e)=>s+e.beban,0)/T:0,
    peakShare:T?pkN/T*100:0,peak:pk,topF:topF?topF[0]:'-',topU:topU?topU[0]:'-'};
  return{list,trips,dil,T,total,pctAll,aset,pctAset,ens,avgDur,causes,topF,topU,hr,pk,pkN,topW,nor,score,status,why,ctx,
    ar:trips.reduce((m,e)=>(inc(m,e.ar),m),{})}}

function vEval(c){const a=analyze(filtered());
  const col=a.status==='BAIK'?'#17b26a':a.status==='WASPADA'?'#ffb020':'#ff6159',bc=a.status==='BAIK'?'b-ok':a.status==='WASPADA'?'b-w':'b-k';
  if(!a.total){c.innerHTML='<div class="card empty">Tidak ada data padam >5 menit pada filter yang dipilih.</div>';return}
  const pen=a.why.filter(w=>w.pen>0).sort((x,y)=>y.pen-x.pen);
  const top=a.causes[0],cn=top?CAUSES[top[0]]:'-';
  const ringal=`conic-gradient(${col} ${a.score*3.6}deg,#eef1f9 0)`;
  const why=a.why.map(w=>`<div class="it"><b>${w.f}</b><span class="${w.pen?'neg':'pos'}">${w.pen?'−'+w.pen+' poin':'0 poin'}</span><small><b>Nilai: ${w.val}.</b> ${w.reason}</small></div>`).join('');
  const kesimpulan=`Status <b>${a.status}</b> (skor ${a.score}/100) ${pen.length?'diberikan terutama karena '+pen.slice(0,3).map(w=>w.f.toLowerCase()+' ('+w.val+')').join(', ')+'.':'diberikan karena seluruh indikator berada dalam batas wajar.'} Ambang penilaian: BAIK ≥ 80, WASPADA 60–79, KRITIS < 60. Skor dimulai dari 100 lalu dikurangi sesuai tingkat keparahan tiap indikator di atas.`;
  const ring=`<div class="ring" style="background:${ringal}"><div><b style="color:${col}">${a.score}</b><span>dari 100</span></div></div>`;
  /* keterangan otomatis */
  const dom=top?Math.round(top[1].n/a.T*100):0,
    sesaat=a.causes.find(x=>x[0]==='sesaat'),sesN=sesaat?sesaat[1].n:0;
  let ket=`Terdapat ${fmt(a.T)} padam trip berdurasi >5 menit dari ${fmt(a.total)} laporan tercatat (${fmt(a.pctAll,1)}% adalah trip; sisanya ${fmt(a.dil.length)} laporan pemeliharaan/manuver). `;
  if(a.pctAset!==null)ket+=`Dibandingkan ${fmt(a.aset)} aset switching pada cakupan ini, jumlah trip setara ${fmt(a.pctAset,2)}% dari aset. `;
  ket+=top?`Penyebab dominan adalah ${cn.toLowerCase()} (${dom}% dari trip). `:'';
  if(a.topF)ket+=`Penyulang ${a.topF[0]} paling sering trip (${a.topF[1].n}x) dan ULP ${a.topU[0]} paling terdampak (${a.topU[1].n} trip). `;
  ket+=`Gangguan paling banyak terjadi pada pukul ${String(a.pk).padStart(2,'0')}:00–${String(a.pk+1).padStart(2,'0')}:00 WITA dengan kondisi cuaca dominan ${a.topW?a.topW[0].toLowerCase():'-'}. Rata-rata pemulihan ${fmt(a.avgDur,1)} menit dan energi tak tersalurkan ${fmt(a.ens,1)} kWh. `;
  ket+=`Pada penyulang SUTM 20 kV, gangguan temporer (pohon, petir, binatang) umumnya mendominasi kejadian trip, sehingga pengendalian ROW, proteksi petir, dan percepatan lokalisir gangguan menjadi pengungkit utama perbaikan keandalan${sesN?` — ${sesN} kejadian di antaranya berupa gangguan sesaat`:''}.`;
  const bars=a.causes.map(([k,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px"><b>${CAUSES[k]}</b><span class="mono">${v.n} • ${fmt(v.n/a.T*100,1)}%</span></div><div class="bar"><i style="width:${v.n/a.T*100}%"></i></div></div>`).join('');
  const det=a.causes.map(([k,v])=>{const kb=KB[k];
    const blk=(cls,tt,ar)=>ar.length?`<div class="ac ${cls}"><h4>${tt}</h4><ul>${ar.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
    return `<div class="cause"><h3>${CAUSES[k]}</h3><div class="meta"><span class="badge b-k">${v.n} trip</span><span class="sub" style="margin:0">${fmt(v.n/a.T*100,1)}% dari padam trip • rata-rata pemulihan ${fmt(v.min/v.n,1)} mnt • ENS ${fmt(v.ens,1)} kWh</span></div>
     <div class="acts4">${blk('a-i','🔍 Inspeksi',kb.I)}${blk('a-p','🛠 Pemeliharaan',kb.P)}${blk('a-r','🌿 ROW',kb.R)}</div></div>`}).join('');
  c.innerHTML=`<div class="grid g2" style="margin-bottom:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)">
   <div class="card"><h2>Status Keandalan Jaringan</h2><p class="sub">${esc(S.f.feeder!=='SEMUA'?'Penyulang '+S.f.feeder:S.f.ulp!=='SEMUA'?'ULP '+S.f.ulp:S.f.up3!=='SEMUA'?'UP3 '+S.f.up3:S.f.dcc!=='SEMUA'?S.f.dcc:'Seluruh UP2D Suluttenggo')}</p>
    <div class="stat">${ring}<div><span class="badge ${bc}" style="font-size:14px;padding:5px 14px">${a.status}</span><p style="margin:10px 0 0;font-size:12.5px;color:var(--mut)">${kesimpulan}</p></div></div></div>
   <div class="card"><h2>Alasan Pemberian Status</h2><p class="sub">Rincian indikator dan pengurang skor</p><div class="why">${why}</div></div></div>
  <div class="card" style="margin-bottom:14px"><h2>Keterangan Evaluasi Otomatis</h2><p class="sub">Disusun otomatis dari data padam >5 menit dan data aset</p><div class="note">${ket}</div></div>
  <div class="card" style="margin-bottom:14px"><h2>Penyebab Padam Trip</h2><p class="sub">Pengelompokan otomatis berdasarkan sub kelompok & keterangan logsheet</p>${bars}</div>
  <div class="card"><h2>Tindakan Berdasarkan Penyebab Padam Trip</h2><p class="sub">Inspeksi, pemeliharaan, dan ROW ditampilkan hanya bila sesuai dengan penyebab dan kondisi data</p>${det}</div>`}

   ${tr.length?`<div class="card" style="margin-top:14px"><h2>Kinerja Auto Reclose (Padam Trip)</h2><p class="sub">Status reclose</p>${Object.entries(ar).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px"><b>${k}</b><span class="mono">${v} • ${fmt(v/tr.length*100,1)}%</span></div><div class="bar"><i style="width:${v/tr.length*100}%"></i></div></div>`).join('')}</div>`:''}`}

let RC=null;
function descFilter(){const f=S.f,p=[];if(f.bulan!=='SEMUA')p.push(f.bulan);if(f.dcc!=='SEMUA')p.push(f.dcc);if(f.up3!=='SEMUA')p.push('UP3 '+f.up3);if(f.ulp!=='SEMUA')p.push('ULP '+f.ulp);if(f.q)p.push('“'+f.q+'”');return p.length?p.join(' • '):'Semua wilayah & periode'}
const EVH=['Tanggal','Tipe','DCC','UP3','ULP','Penyulang','PMT','Zona','Jam Padam','Jam Masuk','Durasi (mnt)','Penyebab / Alasan','Penormalan','Auto Reclose','ENS (kWh)','Keterangan'];
const evRow=e=>[e.tanggal,e.tipe==='Trip'?'Padam Trip':'Pemeliharaan/Dilepas',e.dcc,e.up3,e.ulp,e.feeder,e.pmt,e.zona,e.jamPadam,e.jamMasuk,e.menit,e.tipe==='Trip'?CAUSES[causeOf(e)]:e.alasan,e.nor,e.ar,e.ens,e.ket];
const det=(l,name,xonly)=>({name,xonly,det:true,head:EVH,rows:l.map(evRow)});
const ASH=['No','PMT / LBS / Peralatan','Motorized/Manual','Penyulang','Gardu Induk','ULP','UP3'];
const asDet=(l,name)=>({name,det:true,head:ASH,rows:l.map((x,i)=>[i+1,x.nama,x.mode,x.peny,x.gi,x.ulp,x.up3])});
const EV=l=>({secs:[det(l,'Detail Padam')]}),AS=l=>({secs:[asDet(l,'Detail Aset')]});
const isMo=x=>x.mode.startsWith('MOTOR');
const tag=(r,d,dc)=>{r.d=d;if(dc)r.dc=dc;return r};
const pc=(n,t)=>t?fmt(n/t*100,1)+'%':'-';
const hourOf=e=>parseInt((e.jamTrip!=='-'?e.jamTrip:e.jamPadam).split(':')[0],10);
function grp(list,kf){const g={};list.forEach(e=>{const k=kf(e);g[k]=g[k]||{n:0,m:0,ens:0,l:[]};const v=g[k];v.n++;v.m+=e.menit;v.ens+=e.ens;v.l.push(e)});return Object.entries(g).sort((x,y)=>y[1].n-x[1].n)}
function rec(name,list,h1,kf,withEns){return{name,head:[h1,'Jumlah','%','Rata-rata durasi (mnt)'].concat(withEns?['ENS (kWh)']:[]),
  rows:grp(list,kf).map(([k,v])=>tag([k,v.n,pc(v.n,list.length),+(v.m/v.n).toFixed(1)].concat(withEns?[+v.ens.toFixed(1)]:[]),EV(v.l)))}}
function asGroup(list,h1,kf,name){const g={};list.forEach(x=>{const k=kf(x)||'-';(g[k]=g[k]||[]).push(x)});
  return{name:name||('Aset per '+h1),head:[h1,'Jumlah Aset','Motorized','Manual'],rows:Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,l])=>
    tag([k,l.length,l.filter(isMo).length,l.filter(x=>!isMo(x)).length],AS(l),{2:AS(l.filter(isMo)),3:AS(l.filter(x=>!isMo(x)))}))}}
function asUp3(list){const g={};list.forEach(x=>{const k=x.up3||'-';(g[k]=g[k]||[]).push(x)});
  return{name:'Aset per UP3',head:['UP3','Jumlah Aset','Motorized','Manual','Gardu Induk','ULP'],rows:Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,l])=>{
    const mo=l.filter(isMo),ma=l.filter(x=>!isMo(x));
    return tag([k,l.length,mo.length,ma.length,new Set(l.map(x=>x.gi)).size,new Set(l.map(x=>x.ulp)).size],AS(l),{2:AS(mo),3:AS(ma),4:{secs:[asGroup(l,'Gardu Induk',x=>x.gi)]},5:{secs:[asGroup(l,'ULP',x=>x.ulp)]}})})}}
function openAsset(up3,what){const l=asetScope().filter(x=>x.up3===up3);let s,t='Aset UP3 '+up3;
  if(what==='gi'){s=asGroup(l,'Gardu Induk',x=>x.gi);t+=' › Gardu Induk'}else if(what==='ulp'){s=asGroup(l,'ULP',x=>x.ulp);t+=' › ULP'}
  else if(what==='mo'){s=asDet(l.filter(isMo),'Aset Motorized');t+=' › Motorized'}else if(what==='ma'){s=asDet(l.filter(x=>!isMo(x)),'Aset Manual');t+=' › Manual'}else s=asDet(l,'Detail Aset');
  showRC({title:t,secs:[s],kind:'aset_'+up3,parent:null})}
function openRecap(kind){
  const L=filtered(),a=analyze(L),tr=a.trips,dl=a.dil,secs=[],A=asetScope();let title='';
  switch(kind){
   case'all':title='Detail Semua Padam';secs.push(det(L,'Detail Semua Padam'));break;
   case'trip':title='Rekapan Padam Trip >5 Menit';
    secs.push({name:'Ringkasan',head:['Parameter','Nilai'],rows:[tag(['Total Trip',a.T],EV(tr)),tag(['Rata-rata durasi pemulihan (mnt)',+a.avgDur.toFixed(1)],EV(tr)),tag(['ENS (kWh)',+a.ens.toFixed(1)],EV(tr))]});
    secs.push(rec('Trip per Zona',tr,'Zona',e=>e.zona&&e.zona!=='-'?'Zona '+e.zona:'Zona tidak tercatat'));secs.push(rec('Penyebab Trip',tr,'Penyebab',e=>CAUSES[causeOf(e)],true));secs.push(rec('Auto Reclose',tr,'Status Auto Reclose',e=>e.ar));secs.push(det(tr,'Detail Trip',true));break;
   case'dil':title='Rekapan Pemeliharaan / Dilepas';
    secs.push({name:'Ringkasan',head:['Parameter','Nilai'],rows:[tag(['Total kejadian',dl.length],EV(dl)),tag(['Rata-rata durasi padam (mnt)',dl.length?+(dl.reduce((s,e)=>s+e.menit,0)/dl.length).toFixed(1):0],EV(dl)),tag(['Total durasi (jam)',+(dl.reduce((s,e)=>s+e.menit,0)/60).toFixed(1)],EV(dl))]});
    secs.push(rec('Alasan Dilepas',dl,'Alasan (HAR, Emergency, Manuver, dll)',e=>e.alasan));secs.push(det(dl,'Detail Pemeliharaan',true));break;
   case'pctAll':title='% Trip terhadap Semua Laporan';
    secs.push({name:'Perhitungan',head:['Parameter','Nilai'],rows:[tag(['Padam trip >5 menit',a.T],EV(tr)),tag(['Pemeliharaan/pengamanan/manuver (semua durasi)',dl.length],EV(dl)),tag(['Total laporan tercatat',a.total],EV(L)),tag(['% Trip thd semua laporan',pc(a.T,a.total)],EV(tr))]});break;
   case'pctAset':title='% Trip terhadap Jumlah Aset';
    secs.push({name:'Perhitungan',head:['Parameter','Nilai'],rows:[tag(['Jumlah aset pada cakupan filter',A.length],AS(A)),tag(['Motorized',A.filter(isMo).length],AS(A.filter(isMo))),tag(['Manual',A.filter(x=>!isMo(x)).length],AS(A.filter(x=>!isMo(x)))),tag(['Padam trip >5 menit',a.T],EV(tr)),tag(['% Trip thd aset',a.pctAset===null?'Data aset belum termuat':fmt(a.pctAset,2)+'%'],EV(tr))]});
    if(A.length)secs.push(asUp3(A));break;
   case'ens':title='ENS Padam Trip per Penyebab';secs.push(rec('ENS per Penyebab',tr,'Penyebab',e=>CAUSES[causeOf(e)],true));break;
   case'jam':title='Padam Trip per Jam (WITA)';secs.push({name:'Per Jam',head:['Jam','Jumlah Trip','%'],rows:a.hr.map((n,h)=>tag([String(h).padStart(2,'0')+':00',n,pc(n,a.T)],EV(tr.filter(e=>hourOf(e)===h))))});break;
   case'feeder':{title='Penyulang dengan Trip Terbanyak';const g=grp(tr.filter(e=>e.feeder!=='-'),e=>e.feeder+'|'+e.ulp+'|'+e.up3).slice(0,15);
    secs.push({name:'Top Penyulang',head:['Penyulang','ULP','UP3','Jumlah Trip','Rata-rata durasi (mnt)','ENS (kWh)'],rows:g.map(([k,v])=>{const p=k.split('|');return tag([p[0],p[1],p[2],v.n,+(v.m/v.n).toFixed(1),+v.ens.toFixed(1)],EV(v.l))})});break}
   case'aAll':title='Total Aset Switching';secs.push({name:'Ringkasan',head:['Parameter','Nilai'],rows:[tag(['Total aset',A.length],AS(A)),tag(['Motorized',A.filter(isMo).length],AS(A.filter(isMo))),tag(['Manual',A.filter(x=>!isMo(x)).length],AS(A.filter(x=>!isMo(x))))]});secs.push(asUp3(A));break;
   case'aMo':title='Aset Motorized (SCADA)';secs.push(asUp3(A.filter(isMo)));secs.push(asDet(A.filter(isMo),'Detail Aset Motorized'));break;
   case'aMan':title='Aset Manual';secs.push(asUp3(A.filter(x=>!isMo(x))));secs.push(asDet(A.filter(x=>!isMo(x)),'Detail Aset Manual'));break}
  showRC({title,secs,kind,parent:null})}
function showRC(rc){RC=rc;rc.vis=rc.secs.filter(s=>!s.xonly);
  let h=`<div class="mdl" id="md" onclick="if(event.target===this)closeModal()"><div class="mbox"><div class="mh"><div><h2>${esc(rc.title)}</h2><p class="sub" style="margin:0">${esc(descFilter())}${rc.vis.some(s=>!s.det)?' • <b>klik angka untuk melihat detail</b>':''}</p></div><div class="mhb">${rc.parent?'<button class="xc" style="width:auto;padding:0 12px;font-weight:700;font-size:12px" onclick="showRC(RC.parent)">‹ Kembali</button>':''}<button class="xb" onclick="exportRecap()">⬇ Export Excel</button><button class="xc" onclick="closeModal()" aria-label="Tutup">✕</button></div></div><div class="mb">`;
  rc.vis.forEach((s,si)=>{const R=s.rows.slice(0,200);
    h+=`<h3 style="margin:14px 0 8px;font-size:13.5px">${esc(s.name)} <span class="sub" style="font-weight:500">(${fmt(s.rows.length)} baris)</span></h3><div class="tw"><table style="min-width:${s.head.length>6?900:360}px"><thead><tr>${s.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${R.map((r,ri)=>`<tr>${r.map((x,ci)=>{const d=r.dc&&r.dc[ci]!==undefined?r.dc[ci]:r.d;return ci>0&&d?`<td><a class="num" onclick="drill(${si},${ri},${ci})">${esc(x)}</a></td>`:`<td>${esc(x)}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${s.head.length}" class="empty">Tidak ada data</td></tr>`}</tbody></table></div>`+
    (s.rows.length>200?`<p class="sub" style="margin-top:6px">Menampilkan 200 dari ${fmt(s.rows.length)} baris — file Excel berisi seluruh data.</p>`:'')});
  h+='</div></div></div>';closeModal();document.body.insertAdjacentHTML('beforeend',h);document.body.style.overflow='hidden'}
function drill(si,ri,ci){const r=RC.vis[si].rows[ri],d=r.dc&&r.dc[ci]!==undefined?r.dc[ci]:r.d;if(!d)return;
  showRC({title:RC.title+' › '+r[0]+(ci>0&&RC.vis[si].head[ci]&&r.dc&&r.dc[ci]!==undefined?' › '+RC.vis[si].head[ci]:''),secs:d.secs,kind:RC.kind+'_detail',parent:RC})}
function closeModal(){const m=document.getElementById('md');if(m)m.remove();document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function exportRecap(){if(!RC)return;const wb=XLSX.utils.book_new(),used={};
  RC.secs.forEach(s=>{let n=s.name.replace(/[\[\]:*?\/\\]/g,'').slice(0,28)||'Sheet';if(used[n]){n+=' '+(++used[n])}else used[n]=1;
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([s.head].concat(s.rows)),n)});
  XLSX.writeFile(wb,'Rekap_'+RC.kind.replace(/[^A-Za-z0-9_]+/g,'_').slice(0,40)+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}

/* ================= MUAT DATA (cache instan + tarik paralel) ================= */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ST={u:[],b:[],loading:true};
function uiRefresh(){const ae=document.activeElement;if(!(ae&&ae.id==='q'))buildFilters();renderContent()}
function applyData(){const m=mergeSources(ST.u,ST.b);if(m.length)S.all=m;uiRefresh()}
function setSync(cls,txt){$('#dot').className='dot'+(cls?' '+cls:'');$('#syncTxt').textContent=txt}
async function loadAll(){
  setSync('spin','Menyinkronkan…');ST.loading=true;
  const job=(tag,src,gas,parse,done)=>fetchCsv(src,tag,gas).then(t=>{LS.set('c_'+tag,t);done(parse(t))});
  const r=await Promise.allSettled([
    job('utama',SRC.utama,true,parseLog,v=>{ST.u=v;applyData()}),
    job('backup',SRC.backup,true,parseLog,v=>{ST.b=v;applyData()}),
    job('aset',SRC.aset,false,parseAset,v=>{if(v.length){S.aset=v;uiRefresh()}})]);
  ST.loading=false;const ok=r[0].status==='fulfilled'||r[1].status==='fulfilled';
  setSync(ok?'':'off',ok?`${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} WITA • ${fmt(S.all.length)} data • aset ${fmt(S.aset.length)}`:'Gagal terhubung — memakai data cache');
  uiRefresh()}
(function boot(){
  try{const cu=LS.get('c_utama'),cb=LS.get('c_backup'),ca=LS.get('c_aset');if(cu)ST.u=parseLog(cu);if(cb)ST.b=parseLog(cb);if(ca)S.aset=parseAset(ca)}catch(e){}
  if(ST.u.length||ST.b.length)S.all=mergeSources(ST.u,ST.b);
  $('#app').innerHTML='<div id="fb"></div><div id="ct"></div>';
  buildNav();buildFilters();renderContent();loadAll();setInterval(loadAll,REFRESH_MIN*60000);
  document.addEventListener('DOMContentLoaded',()=>renderContent());
})();
</script>
